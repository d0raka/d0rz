name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore binary assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          assets = Path("assets")
          if assets.exists():
              for path in assets.glob("*.b64"):
                  target = path.with_name(path.name.removesuffix(".b64"))
                  target.write_bytes(base64.b64decode(path.read_text()))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create Pages site
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const attempts = [
              { build_type: 'legacy', source: { branch: 'gh-pages', path: '/' } },
              { build_type: 'workflow' },
            ]
            for (const body of attempts) {
              try {
                const res = await github.request('POST /repos/{owner}/{repo}/pages', { owner, repo, ...body })
                console.log('created pages', res.status, JSON.stringify(res.data))
                return
              } catch (error) {
                console.log('create pages failed', body.build_type, error.status, error.message)
              }
            }

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
