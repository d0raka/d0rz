name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore binary assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          assets = Path("assets")
          if assets.exists():
              for path in assets.glob("*.b64"):
                  target = path.with_name(path.name.removesuffix(".b64"))
                  target.write_bytes(base64.b64decode(path.read_text()))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

      - name: Point GitHub Pages at gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const desired = {
              build_type: 'legacy',
              source: { branch: 'gh-pages', path: '/' },
            }

            try {
              const current = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo })
              console.log('current pages', JSON.stringify(current.data))
            } catch (error) {
              console.log('get pages failed', error.status, error.message)
              try {
                const created = await github.request('POST /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  ...desired,
                })
                console.log('created pages', created.status, JSON.stringify(created.data))
              } catch (createError) {
                console.log('create pages failed', createError.status, createError.message)
              }
            }

            try {
              const updated = await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                ...desired,
              })
              console.log('updated pages', updated.status, JSON.stringify(updated.data))
            } catch (error) {
              console.log('update pages failed', error.status, error.message)
            }

            try {
              const rebuilt = await github.request('POST /repos/{owner}/{repo}/pages/builds', {
                owner,
                repo,
              })
              console.log('requested pages build', rebuilt.status, JSON.stringify(rebuilt.data))
            } catch (error) {
              console.log('pages build request failed', error.status, error.message)
            }
